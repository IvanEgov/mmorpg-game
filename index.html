<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dungeon Chronicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game" width="960" height="640"></canvas>
    
    <div id="hud">
        <div class="stat">❤️ <span id="hp">100</span>/<span id="hpMax">100</span></div>
        <div class="stat">⭐ Ур. <span id="lvl">1</span></div>
        <div class="stat">💰 <span id="gold">50</span></div>
        <div class="stat">📍 <span id="location-name">🏰 Стартовый город</span></div>
        <div class="xp-bar-container">
            <div id="xp-bar-fill" style="width: 0%;"></div>
            <span id="xp-text">0 / 100 XP</span>
        </div>
    </div>

    <div id="menu-buttons">
        <button id="btn-inv">🎒</button>
        <button id="btn-stats">📊</button>
        <button id="btn-skills">🌳</button>
        <button id="btn-interact">💬</button>
        <button id="btn-attack">⚔️</button>
    </div>

    <div id="mobile-controls">
        <div id="joystick-container">
            <div id="joystick-base"></div>
            <div id="joystick-stick"></div>
        </div>
    </div>

    <!-- Панели -->
    <div id="panel-inventory" class="game-panel hidden">
        <h2>🎒 Инвентарь</h2>
        <div id="inventory-list" class="list-container"></div>
        <button class="btn-close" id="close-inv">Закрыть</button>
    </div>

    <div id="panel-stats" class="game-panel hidden">
        <h2>📊 Характеристики (Очков: <span id="stat-points">0</span>)</h2>
        <div class="stats-grid">
            <div class="stat-row"><span>💪 Сила</span><span id="stat-str">0</span><button data-stat="str">+</button></div>
            <div class="stat-row"><span>💨 Ловкость</span><span id="stat-agi">0</span><button data-stat="agi">+</button></div>
            <div class="stat-row"><span>🧠 Интеллект</span><span id="stat-int">0</span><button data-stat="int">+</button></div>
            <div class="stat-row"><span>❤️ Живучесть</span><span id="stat-vit">0</span><button data-stat="vit">+</button></div>
        </div>
        <h3>Итоговые показатели</h3>
        <div class="derived-stats">
            <div>❤️ HP: <span id="derived-hp">0</span></div>
            <div>💧 MP: <span id="derived-mp">0</span></div>
            <div>⚔️ Атака: <span id="derived-atk">0</span></div>
            <div>🛡️ Защита: <span id="derived-def">0</span></div>
        </div>
        <button class="btn-close" id="close-stats">Закрыть</button>
    </div>

    <div id="panel-skills" class="game-panel hidden">
        <h2>🌳 Навыки (Очков: <span id="skill-points-display">0</span>)</h2>
        <div id="skills-list" class="list-container"></div>
        <button class="btn-close" id="close-skills">Закрыть</button>
    </div>

    <!-- НОВЫЕ ПАНЕЛИ -->
    <div id="panel-npc" class="game-panel hidden">
        <h2 id="npc-name">NPC</h2>
        <div id="npc-options"></div>
        <button class="btn-close" id="close-npc">Закрыть</button>
    </div>

    <div id="panel-shop" class="game-panel hidden">
        <h2>🏪 Магазин</h2>
        <div id="shop-list" class="list-container"></div>
        <button class="btn-close" id="close-shop">Закрыть</button>
    </div>

    <div id="panel-quests" class="game-panel hidden">
        <h2>📜 Квесты</h2>
        <div id="quest-list" class="list-container"></div>
        <button class="btn-close" id="close-quests">Закрыть</button>
    </div>

    <div id="panel-storage" class="game-panel hidden">
        <h2>📦 Хранилище</h2>
        <div id="storage-list" class="list-container"></div>
        <button class="btn-close" id="close-storage">Закрыть</button>
    </div>

    <div id="panel-deposit" class="game-panel hidden">
        <h2>📥 Положить в хранилище</h2>
        <div id="deposit-list" class="list-container"></div>
        <button class="btn-close" id="close-deposit">Назад</button>
    </div>

    <script src="js/data/constants.js"></script>
    <script src="js/locations/Location.js"></script>
    <script src="js/locations/CityLocation.js"></script>
    <script src="js/locations/DungeonLocation.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/PlayerRenderer.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/EnemyRenderer.js"></script>
    <script src="js/entities/NPC.js"></script>
    <script src="js/entities/Portal.js"></script>
    <script src="js/core/UIManager.js"></script>
    <script src="js/core/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
